# Streamlit Community Cloud hibernates an app that has had no traffic, and a
# sleeping app greets the next visitor with a "Zzzz" screen plus a rebuild wait -
# a good way to lose participants mid-recruitment.
#
# "Traffic" means a real app session: the browser loading the page and opening a
# WebSocket to the container. A plain HTTP request does not count, and returns 200
# whether the app is awake or asleep - so an HTTP pinger reports success while the
# app sleeps. This workflow therefore drives headless Chromium and only passes once
# the survey has actually rendered.
#
# It stops on its own at COLLECTION_ENDS and disables itself. To extend the study,
# change that date and re-enable the workflow (Actions -> Keep the survey awake ->
# "..." -> Enable workflow).

name: Keep the survey awake

env:
  APP_URL: "https://tem6j6jhm5dtyan6mq7mtl.streamlit.app"
  # Last day to keep the app warm, inclusive, UTC.
  COLLECTION_ENDS: "2026-09-09"

on:
  schedule:
    # Every 2 hours. GitHub delays scheduled jobs on free runners, so treat this as
    # "roughly every 2-4 hours" - still comfortably inside the hibernation window.
    - cron: "0 */2 * * *"
  workflow_dispatch: # visit on demand from the Actions tab

permissions:
  actions: write # so the job can disable this workflow when the window closes

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the collection window
        id: window
        run: |
          TODAY=$(date -u +%F)
          echo "today (UTC): $TODAY, window ends: $COLLECTION_ENDS"
          if [ "$TODAY" \> "$COLLECTION_ENDS" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "Collection window has closed."
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.expired == 'false'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.expired == 'false'
        with:
          python-version: "3.12"

      - name: Install headless Chromium
        if: steps.window.outputs.expired == 'false'
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Visit the app
        if: steps.window.outputs.expired == 'false'
        run: python scripts/keep_awake.py

      - name: Retire this workflow once the window closes
        if: steps.window.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::Collection window ended $COLLECTION_ENDS - disabling the keep-awake workflow."
          gh workflow disable "Keep the survey awake" --repo "$GITHUB_REPOSITORY"
