# Streamlit Community Cloud puts an app to sleep after a period with no traffic.
# A sleeping app greets the next visitor with a "Zzzz" screen and a two-minute
# rebuild, which is a good way to lose participants. This workflow requests the
# app periodically so it stays warm while the study is running.
#
# Turn it off when data collection ends: Actions -> Keep the survey awake ->
# "..." -> Disable workflow. It costs nothing on a public repo, but there is no
# reason to keep pinging a survey nobody is filling in.

name: Keep the survey awake

on:
  schedule:
    # Every 30 minutes. GitHub often runs scheduled jobs late, which is fine here.
    - cron: "*/30 * * * *"
  workflow_dispatch: # lets you wake it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the app
        run: |
          URL="https://tem6j6jhm5dtyan6mq7mtl.streamlit.app"
          echo "Pinging $URL"

          # Assign, then check the exit status separately: putting `|| echo 000`
          # inside the substitution concatenates curl's output with the fallback.
          STATUS=$(curl -sS -o /dev/null -L --max-time 90 \
                        -A "keep-awake-bot (github actions)" \
                        -w '%{http_code}' "$URL") || STATUS="000"
          echo "final HTTP status: $STATUS"

          case "$STATUS" in
            2*) echo "App is awake." ;;
            000) echo "::warning::Request failed outright - app may be down." ;;
            *)  echo "::warning::Unexpected status $STATUS - check the app." ;;
          esac
